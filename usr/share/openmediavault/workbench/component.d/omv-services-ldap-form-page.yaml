version: "1.0"
type: component
data:
  name: omv-services-ldap-form-page
  type: formPage
  config:
    request:
      service: LDAP
      get:
        method: getSettings
      post:
        method: setSettings
    fields:
      - type: checkbox
        name: enable
        label: _("Enabled")
        value: false
      - type: select
        name: backend
        label: _("Backend")
        hint: _("The client service used to resolve and authenticate LDAP users. SSSD additionally supports offline credential caching.")
        value: "nslcd"
        store:
          data:
            - ["nslcd", "nss-pam-ldapd (nslcd)"]
            - ["sssd", "SSSD"]
        validators:
          required: true
      - type: numberInput
        name: port
        label: _("Port")
        value: 389
        validators:
          required: true
          min: 1
          max: 65535
          patternType: port
          required: true
      - type: textInput
        name: host
        label: _("Host")
        hint: _("The FQDN or IP address of the server.")
        value: "ldap.example.net"
        validators:
          required: true
      - type: checkbox
        name: enablessl
        label: _("Enable SSL (LDAPS)")
        hint: _("Use an explicit SSL/TLS connection (ldaps://), typically on port 636.")
        value: false
      - type: checkbox
        name: enablestarttls
        label: _("Enable StartTLS")
        hint: _("Upgrade the plain connection to TLS using StartTLS. Ignored when SSL (LDAPS) is enabled.")
        value: false
        modifiers:
          - type: disabled
            constraint:
              operator: truthy
              arg0:
                prop: enablessl
      - type: select
        name: tlsreqcert
        label: _("Certificate validation")
        hint: _("How to handle checking of the server's TLS certificate. Use 'demand' for a properly issued certificate, 'never' to disable validation (e.g. self-signed without a local CA).")
        value: "demand"
        store:
          data:
            - ["never", _("never")]
            - ["allow", _("allow")]
            - ["try", _("try")]
            - ["demand", _("demand")]
            - ["hard", _("hard")]
        modifiers:
          - type: visible
            constraint:
              operator: or
              arg0:
                operator: truthy
                arg0:
                  prop: enablessl
              arg1:
                operator: truthy
                arg0:
                  prop: enablestarttls
      - type: textInput
        name: base
        label: _("Base DN")
        hint: _("Specifies the base distinguished name (DN) to use as search base, e.g. 'dc=example,dc=net'.")
        value: "dc=example,dc=net"
      - type: textInput
        name: rootbinddn
        label: _("Root Bind DN")
        hint: _("Specifies the distinguished name (DN) with which to bind to the directory server for lookups, e.g. 'cn=manager,dc=example,dc=net'.")
        value: "cn=manager,dc=example,dc=net"
      - type: passwordInput
        name: rootbindpw
        label: _("Password")
        hint: _("Specifies the credentials with which to bind.")
        value: ""
      - type: textInput
        name: usersuffix
        label: _("Users suffix")
        hint: _("Specifies the user suffix, e.g. 'ou=Users'.")
        value: "ou=Users"
      - type: textInput
        name: groupsuffix
        label: _("Groups suffix")
        hint: _("Specifies the group suffix, e.g. 'ou=Groups'.")
        value: "ou=Groups"
      - type: textarea
        name: extragroupsuffix
        label: _("Additional group suffixes")
        hint: _("Optional extra group suffixes to search in addition to the Groups suffix above, one per line. Each is combined with the Base DN. Useful for directories - such as authentik's LDAP outpost - that expose per-user primary groups under a separate OU, e.g. 'ou=virtual-groups'.")
        value: ''
      - type: textInput
        name: machinesuffix
        label: _("Machines suffix")
        hint: _("Specifies the machines suffix, e.g. 'ou=Computers'.")
        value: "ou=Computers"
      - type: textInput
        name: idmapsuffix
        label: _("IdMap suffix")
        hint: _("Specifies the idmap suffix, e.g. 'ou=idmap'.")
        value: "ou=idmap"
      - type: checkbox
        name: enablepam
        label: _("Enable PAM")
        hint: _("Use LDAP for authentication system-wide along with other authentication sources.")
        value: true
      - type: checkbox
        name: cachecredentials
        label: _("Cache credentials")
        hint: _("Allow users to authenticate from cached credentials when the LDAP server is unreachable (SSSD only).")
        value: true
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: backend
              arg1: "sssd"
      - type: checkbox
        name: enumerate
        label: _("Enumerate users and groups")
        hint: _("Pre-fetch and cache the full list of users and groups. Disable on large directories for performance (SSSD only).")
        value: false
        modifiers:
          - type: visible
            constraint:
              operator: eq
              arg0:
                prop: backend
              arg1: "sssd"
      - type: textarea
        name: extraoptions
        label: _("Extra options")
        hint: _("Additional lines appended to the active backend configuration - the <a href='https://manpages.debian.org/trixie/nslcd/nslcd.conf.5.en.html' target='_blank'>nslcd.conf</a> body, or the <a href='https://manpages.debian.org/trixie/sssd/sssd.conf.5.en.html' target='_blank'>sssd.conf</a> domain section.")
        value: ''
      - type: textarea
        name: extraclientoptions
        label: _("Extra client options LDAP.CONF")
        hint: _("Please check the <a href='https://manpages.debian.org/trixie/libldap-common/ldap.conf.5.en.html' target='_blank'>manual page</a> for more details.")
        value: ''
    buttons:
      - template: submit
      - template: cancel
        execute:
          type: url
          url: "/services"
